name: Publish verified review app (manual)
on:
  workflow_dispatch:
    inputs:
      release_sha256:
        description: SHA-256 of the approved release-manifest.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'Concordia-International-School-Shanghai/focs-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify hashes, ZIP identity and explicit file allowlists
        env:
          EXPECTED_RELEASE_SHA256: ${{ inputs.release_sha256 }}
        run: python3 -B tools/verify_release.py --expected-sha "$EXPECTED_RELEASE_SHA256" --stage "$RUNNER_TEMP/review-site"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/review-site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the verified site artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
